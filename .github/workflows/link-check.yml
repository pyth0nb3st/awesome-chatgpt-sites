name: Monthly link check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all active live URLs
        run: python3 scripts/check_links.py | tee link-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-report
          path: link-report.txt
